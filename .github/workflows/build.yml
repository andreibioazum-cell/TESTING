name: Native builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  linux:
    name: Linux CLI and libraries (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld libmbedtls-dev
      - run: make -j"$(nproc)" CC=clang CXX=clang++ LDFLAGS="-fuse-ld=lld" MBEDTLS=1 MINIAUDIO=1 all libraries
      - name: Package
        run: |
          mkdir -p dist/linux
          cp luac build/libluac.a build/libluac.so src/luac.h src/runtime.h src/luac_interpreter.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h src/engine.hpp README.md LICENSE dist/linux/
          cp -r src/third_party examples dist/linux/
          tar -C dist -czf dist/LuaC-linux-x86_64.tar.gz linux
          git archive --format=tar.gz --prefix=LuaC-0.5.0/ -o dist/LuaC-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-linux-x86_64
          path: dist/LuaC-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-source
          path: dist/LuaC-source.tar.gz

  windows:
    name: Windows EXE and libraries (Clang)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            make
            p7zip
            mingw-w64-ucrt-x86_64-mbedtls
      - name: Build CLI and libraries
        shell: msys2 {0}
        env:
          CC: clang
          CXX: clang++
          LDFLAGS: -fuse-ld=lld
        run: |
          set +e
          make -j"$(nproc)" MBEDTLS=1 MINIAUDIO=1 all libraries > build-cli.log 2>&1
          status=$?
          cat build-cli.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 6000 build-cli.log | tr '\r\n' '  ')
            printf '::error file=Makefile::%s\n' "$message"
            exit "$status"
          fi
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/windows
          cp luac.exe build/libluac.a build/libluac.dll src/luac.h src/runtime.h src/luac_interpreter.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h src/engine.hpp README.md LICENSE dist/windows/
          cp -r src/third_party examples dist/windows/
          cp /ucrt64/bin/libmbed*.dll dist/windows/
          7z a -tzip -mx=1 dist/LuaC-windows-x86_64.zip ./dist/windows/*
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-windows-x86_64
          path: dist/LuaC-windows-x86_64.zip

  macos:
    name: macOS CLI and libraries (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install mbedtls@3 pkg-config
      - run: make -j"$(sysctl -n hw.ncpu)" CC=clang CXX=clang++ MBEDTLS=1 MINIAUDIO=1 MBEDTLS_CFLAGS="-I$(brew --prefix mbedtls@3)/include" MBEDTLS_LDFLAGS="-L$(brew --prefix mbedtls@3)/lib -lmbedtls -lmbedx509 -lmbedcrypto" all libraries
      - name: Package universal sources and native arm64 build
        run: |
          mkdir -p dist/macos
          cp luac build/libluac.a build/libluac.dylib src/luac.h src/runtime.h src/luac_interpreter.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h src/engine.hpp README.md LICENSE dist/macos/
          cp -r src/third_party examples dist/macos/
          tar -C dist -czf dist/LuaC-macos-arm64.tar.gz macos
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-macos-arm64
          path: dist/LuaC-macos-arm64.tar.gz

  gui-linux:
    name: Vulkan Studio Linux (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan and GLFW dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld libglfw3-dev libvulkan-dev glslang-tools pkg-config
      - run: make -j"$(nproc)" CC=clang CXX=clang++ LDFLAGS="-fuse-ld=lld" all gui
      - name: Package
        run: |
          mkdir -p dist/studio-linux/build
          cp luac build/luac-gui src/runtime.h src/luac_interpreter.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h README.md LICENSE dist/studio-linux/
          cp gui/third_party/Nuklear-LICENSE gui/FONT-LICENSE.txt dist/studio-linux/
          cp build/*.spv dist/studio-linux/build/
          cp -r src/third_party examples dist/studio-linux/
          tar -C dist -czf dist/LuaC-Studio-linux-x86_64.tar.gz studio-linux
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-Studio-linux-x86_64
          path: dist/LuaC-Studio-linux-x86_64.tar.gz

  gui-windows:
    name: Vulkan Studio Windows (Clang)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            make
            p7zip
            pkgconf
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
      - name: Build Vulkan Studio
        shell: msys2 {0}
        env:
          CC: clang
          CXX: clang++
          LDFLAGS: -fuse-ld=lld
        run: make -j"$(nproc)" all gui
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/studio-windows/build
          cp luac.exe build/luac-gui.exe src/runtime.h src/luac_interpreter.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h README.md LICENSE dist/studio-windows/
          cp gui/third_party/Nuklear-LICENSE gui/FONT-LICENSE.txt dist/studio-windows/
          cp /ucrt64/bin/glfw3.dll dist/studio-windows/
          if [ -f /ucrt64/bin/vulkan-1.dll ]; then cp /ucrt64/bin/vulkan-1.dll dist/studio-windows/; fi
          cp build/*.spv dist/studio-windows/build/
          cp -r src/third_party examples dist/studio-windows/
          7z a -tzip -mx=1 dist/LuaC-Studio-windows-x86_64.zip ./dist/studio-windows/*
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-Studio-windows-x86_64
          path: dist/LuaC-Studio-windows-x86_64.zip

  android:
    name: Android APK (NDK Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android NDK and CMake
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ] || [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-cli
              curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli/tools.zip
              unzip -q /tmp/android-cli/tools.zip -d /tmp/android-cli
              rm -rf "$ANDROID_HOME/cmdline-tools/latest"
              mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            fi
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Assemble APK
        working-directory: android
        shell: bash
        run: |
          if ! gradle --no-daemon --parallel assembleDebug > android-build.log 2>&1; then
            message=$(grep -E '(^|[ :])error:|undefined reference|undefined symbol|FAILURE:|^e:' android-build.log | tail -c 3000 | tr '\r\n' '  ' || true)
            echo "::error file=android/app/build.gradle::${message}"
            tail -100 android-build.log
            exit 1
          fi
          tail -20 android-build.log
      - name: Package APK
        run: mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk dist/LuaC-Studio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-Studio-Android-APK
          path: dist/LuaC-Studio-debug.apk
