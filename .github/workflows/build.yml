name: Obsidian Core Studio Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android:
    name: Obsidian Core Studio APK (NDK Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Obsidian Core theme contrast
        run: python3 android/tests/test_theme.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android NDK and CMake
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ] || [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-cli
              curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli/tools.zip
              unzip -q /tmp/android-cli/tools.zip -d /tmp/android-cli
              rm -rf "$ANDROID_HOME/cmdline-tools/latest"
              mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            fi
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Assemble APK
        working-directory: android
        shell: bash
        run: |
          if ! gradle --no-daemon --parallel assembleDebug > android-build.log 2>&1; then
            message=$(grep -E '(^|[ :])error:|undefined reference|undefined symbol|FAILURE:|^e:' android-build.log | tail -c 3000 | tr '\r\n' '  ' || true)
            echo "::error file=android/app/build.gradle::${message}"
            tail -100 android-build.log
            exit 1
          fi
          tail -20 android-build.log
      - name: Verify On-Device Standalone APK Builder
        shell: bash
        run: |
          mkdir -p /tmp/apk_verify_classes /tmp/apk_verify_out
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d /tmp/apk_verify_classes \
            android/app/src/main/java/com/obsidiancore/studio/ApkBuilder.java \
            android/tests/VerifyApkBuilder.java
          java -cp "/tmp/apk_verify_classes:$ANDROID_HOME/platforms/android-35/android.jar" \
            com.obsidiancore.studio.VerifyApkBuilder \
            android/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/apk_verify_out/SpaceDemo-standalone.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -c -v 4 /tmp/apk_verify_out/SpaceDemo-standalone.apk | tail -10
          "$BT/apksigner" verify --verbose /tmp/apk_verify_out/SpaceDemo-standalone.apk
          BADGING=$("$BT/aapt2" dump badging /tmp/apk_verify_out/SpaceDemo-standalone.apk)
          echo "$BADGING" | head -10
          echo "$BADGING" | grep -q "package: name='com.obsidiancore.game.space_demo'"
          echo "$BADGING" | grep -q "application-label:'Space Demo'"
          echo "$BADGING" | grep -q "launchable-activity: name='com.obsidiancore.studio.GamePlayerActivity'"
          unzip -l /tmp/apk_verify_out/SpaceDemo-standalone.apk | grep -q "assets/game_project/main.obs"
          unzip -l /tmp/apk_verify_out/SpaceDemo-standalone.apk | grep -q "assets/game_meta.json"
      - name: Package APK
        run: mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk dist/ObsidianCore-Studio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ObsidianCore-Studio-APK
          path: dist/ObsidianCore-Studio-debug.apk
